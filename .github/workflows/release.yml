name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Read version from tag
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version tag: $env:GITHUB_REF_NAME" }
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: dotnet build Codrio.slnx -c Release "-p:Version=$env:VERSION"
      - run: dotnet test Codrio.slnx -c Release --no-build
      - run: dotnet pack src/Codrio -c Release --no-build "-p:Version=$env:VERSION" -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
