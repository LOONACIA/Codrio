  - id: s5-indexer-operator-type-overloads
    title: add System.Type and generic overloads to indexer and operator types
    type: feat
    scope: builders
    timeout_sec: 2400
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 3·5·7), docs/ADR.md(ADR-004·006), src/Codrio/Rendering/TypeName.cs, src/Codrio/CSharp.cs(Indexer,
      Operator, ImplicitOperator, ExplicitOperator와 스텝 s4가 추가한 Field·Property·Event의 Type·제네릭 오버로드와 XML 문서 문구),
      src/Codrio/Builders/TypeDeclarationBuilder.cs(같은 메서드들과 스텝 s4의 Property·Event 오버로드), src/Codrio/Builders/OperatorBuilder.cs,
      src/Codrio/PublicAPI.Unshipped.txt, tests/Codrio.Tests/Builders/MemberTypeOverloadTests.cs, tests/Codrio.Tests/TestSupport/TypeFixtures.cs.

      인덱서 형식과 연산자 반환 형식, 변환 연산자 형식에 System.Type·제네릭 오버로드를 붙인다. 진입점(`CSharp`)과 TypeDeclarationBuilder<TSelf>의
      람다 메서드 양쪽에 스텝 s4의 Property·Event와 같은 패턴으로 둔다.

      이 계획의 오버로드 규칙: Type 오버로드는 `TypeName.Render(값, nameof(매개변수))`로 호출 시점에 바꾼 문자열을 기존 문자열 오버로드에 넘기고,
      제네릭 오버로드는 같은 클래스의 Type 오버로드에 `typeof(T)`를 넘긴다. 람다 오버로드는 짝으로 두고 선택적 매개변수는 쓰지 않는다. 기존 문자열
      오버로드는 고치지 마라. 이유: 기존 출력과 테스트가 그대로여야 한다. 제네릭 매개변수에 제약을 두지 마라.

      공개 API(CSharp와 TypeDeclarationBuilder<TSelf>에 각각, 반환은 CSharp이면 해당 빌더, TypeDeclarationBuilder면 TSelf):
      - `Indexer(Type type)`, `Indexer(Type type, Action<IndexerBuilder> configure)`, `Indexer<T>()`, `Indexer<T>(Action<IndexerBuilder> configure)`.
      - `Operator(Type returnType, string symbol)`, `Operator(Type returnType, string symbol, Action<OperatorBuilder> configure)`,
        `Operator<T>(string symbol)`, `Operator<T>(string symbol, Action<OperatorBuilder> configure)`. 변환은
        `TypeName.Render(returnType, nameof(returnType))`이므로 예외 ParamName은 `returnType`이다(기존 문자열 오버로드의 매개변수 이름과 같다).
      - `ImplicitOperator(Type type)`, `ImplicitOperator(Type type, Action<OperatorBuilder> configure)`, `ImplicitOperator<T>()`,
        `ImplicitOperator<T>(Action<OperatorBuilder> configure)`. ExplicitOperator도 같은 모양이다.
      TypeDeclarationBuilder의 Type 오버로드는 `Add(CSharp.X(...))`, 제네릭 오버로드는 같은 클래스의 Type 오버로드에 `typeof(T)`를 넘긴다.

      출력 예:
      - `CSharp.Indexer<int>(i => i.Parameter("int", "index")).ToString()` → `int this[int index] { get; set; }\n`
      - `CSharp.Operator<bool>("==", o => o.Public().Static().Parameter("Money", "left").Parameter("Money", "right")
        .Arrow("left.Amount == right.Amount")).ToString()` → `public static bool operator ==(Money left, Money right) => left.Amount == right.Amount;\n`
      - `CSharp.ImplicitOperator<decimal>().ToString()` → `implicit operator decimal();\n`,
        `CSharp.ExplicitOperator(typeof(TimeSpan)).ToString()` → `explicit operator global::System.TimeSpan();\n`

      문서와 PublicAPI: 새 메서드마다 영어 XML 문서. type·returnType·T 설명과 ArgumentException 문구는 스텝 s4의 CSharp.Field Type·제네릭
      오버로드와 같게 쓰고, symbol·configure 설명과 요약은 같은 이름의 기존 문자열 오버로드 문구를 따른다. RS0016 메시지 문자열 그대로
      PublicAPI.Unshipped.txt 항목(예: `static Codrio.CSharp.Operator<T>(string! symbol) -> Codrio.OperatorBuilder!`,
      `Codrio.TypeDeclarationBuilder<TSelf>.Indexer(System.Type! type) -> TSelf!`). PublicAPI.Shipped.txt는 건드리지 마라.

      테스트:
      - tests/Codrio.Tests/Builders/MemberTypeOverloadTests.cs에 추가, `OutputAssert.Equal`로: CSharp의 Indexer·Operator·ImplicitOperator·
        ExplicitOperator 각 네 오버로드 단독 ToString, TypeDeclarationBuilder의 같은 네 오버로드(class·struct·interface·record), 같은 타입의
        문자열·Type·제네릭 출력이 같음, 람다 즉시 한 번 실행, CSharp로 만들어 Add한 경우, 잘못된 Type → ArgumentException(ParamName은 Indexer·
        Implicit·Explicit이 `type`, Operator가 `returnType`)이고 람다 미실행·멤버 미추가, null 인자(Type, symbol, configure), 체이닝 반환값
        (`Assert.Same`).
      - `CompilationAssert.NoErrors`(입력은 `생성한 파일 + "\n" + TypeFixtures.Source`. 이유: CS1529): 블록 namespace 안에 Type·제네릭 형식의
        인덱서를 가진 class와 interface, Type·제네릭 반환 형식의 `==`·`!=` 연산자와 Type·제네릭 implicit·explicit 변환 연산자를 가진 struct를
        담은 완결 파일. 주의: class·struct 연산자는 `public static`(CS0558), `==`·`!=`는 짝(CS0216), 변환 연산자는 원본이나 대상 중 하나가 담는
        타입이어야 한다(CS0556). CS0660·CS0661은 경고라 괜찮다.
      - 기존 테스트 수정: 새 Type 오버로드 때문에 첫 인자가 `null!`인 호출이 CS0121이 된다. tests/Codrio.Tests/Builders/IndexerBuilderTests.cs
        (현재 239·240·242·269·270·272행 부근 `Indexer(null!, ...)`)와 OperatorBuilderTests.cs(262·263·267·268·270·271·290·291·295·296·298·299행 부근
        `Operator(null!, ...)`·`ImplicitOperator(null!, ...)`·`ExplicitOperator(null!, ...)`)의 그 호출만 첫 인자를 `(string)null!`로 바꾼다. 단언과
        다른 테스트는 바꾸지 마라.

      테스트 코드 자체에서 record·init·required를 쓰지 마라(컴파일할 문자열 소스 안은 괜찮다). 이유: 테스트 프로젝트도 net48로 빌드되는데
      IsExternalInit가 없다.
      하지 마라: BaseType·UnderlyingType·Constraint 오버로드(이유: 스텝 s6), attribute 오버로드(이유: 스텝 s7·s8), OperatorBuilder·IndexerBuilder
      파일 변경(이유: 매개변수 오버로드는 스텝 s3에서 끝났고 형식은 CSharp 진입점이 받는다), 연산자 기호 검증(이유: 기존 규칙, 컴파일러에 맡긴다).
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러 서버 프로세스가 세션 종료를
      막을 수 있다.
    expected_files:
      - src/Codrio/CSharp.cs
      - src/Codrio/Builders/TypeDeclarationBuilder.cs
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Builders/MemberTypeOverloadTests.cs
      - tests/Codrio.Tests/Builders/IndexerBuilderTests.cs
      - tests/Codrio.Tests/Builders/OperatorBuilderTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx

  - id: s6-declaration-type-overloads
    title: add System.Type and generic overloads to base types, enum underlying types and type constraints
    type: feat
    scope: builders
    timeout_sec: 2400
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 2·5), docs/ADR.md(ADR-003·004), src/Codrio/Rendering/TypeName.cs,
      src/Codrio/Builders/MethodBuilder.cs(Type·제네릭 오버로드와 XML 문서 문구), src/Codrio/Builders/TypeDeclarationBuilder.cs(BaseType),
      src/Codrio/Builders/EnumBuilder.cs(UnderlyingType), src/Codrio/Builders/TypeParameterBuilder.cs(Constraint), src/Codrio/PublicAPI.Unshipped.txt,
      tests/Codrio.Tests/Builders/TypeParameterBuilderTests.cs, tests/Codrio.Tests/Builders/MemberTypeOverloadTests.cs(오버로드 테스트 구성 예),
      tests/Codrio.Tests/TestSupport/TypeFixtures.cs.

      타입 선언 줄의 타입 참조(기반 타입·인터페이스, enum 기반 형식, 제네릭 타입 제약)에 System.Type·제네릭 오버로드를 붙인다.

      이 계획의 오버로드 규칙: Type 오버로드는 `TypeName.Render(type, nameof(type))`로 호출 시점에 바꾼 문자열을 같은 클래스의 기존 문자열
      오버로드에 넘기고, 제네릭 오버로드는 같은 클래스의 Type 오버로드에 `typeof(T)`를 넘긴다. 기존 문자열 오버로드는 고치지 마라. 이유: 기존
      출력과 테스트가 그대로여야 한다. 제네릭 매개변수에 제약을 두지 마라.

      공개 API:
      - TypeDeclarationBuilder<TSelf>: `TSelf BaseType(Type type)`, `TSelf BaseType<T>()`. class·struct·interface·record·record struct가 상속한다.
      - EnumBuilder: `EnumBuilder UnderlyingType(Type type)`, `EnumBuilder UnderlyingType<T>()`.
      - TypeParameterBuilder: `TypeParameterBuilder Constraint(Type type)`, `TypeParameterBuilder Constraint<T>()`. 기존 문자열 오버로드의 매개변수
        이름은 `constraint`지만 새 오버로드는 `type`이고 예외 ParamName도 `type`이다. 타입·메서드·델리게이트의 TypeParameter 람다가 모두 이 빌더를
        쓰므로 세 곳 모두에 적용된다.
      타입 종류를 검증하지 마라(enum 기반 형식이 정수형인지, 기반 타입이 sealed인지, 제약이 object인지 등). 이유: 문자열 오버로드도 검증하지 않고
      판단은 컴파일러에 맡긴다(ADR 원칙). 키워드 별칭 규칙 때문에 `UnderlyingType<byte>()`는 `byte`가 되어 그대로 컴파일된다.

      출력 예:
      - `CSharp.Class("Widget", c => c.BaseType<Collection<int>>().BaseType(typeof(IDisposable))).ToString()` →
        `class Widget : global::System.Collections.ObjectModel.Collection<int>, global::System.IDisposable\n{\n}\n`
      - `CSharp.Enum("Level", e => e.UnderlyingType<byte>().Member("Low")).ToString()` → `enum Level : byte\n{\n    Low\n}\n`
      - `CSharp.Class("Repo", c => c.TypeParameter("T", t => t.Constraint("class").Constraint<IDisposable>())).ToString()` →
        `class Repo<T> where T : class, global::System.IDisposable\n{\n}\n`
      - `CSharp.Method("Use", m => m.TypeParameter("T", t => t.Constraint(typeof(IComparable<int>)))).ToString()` →
        `void Use<T>() where T : global::System.IComparable<int>;\n`

      문서와 PublicAPI: 새 메서드마다 영어 XML 문서. type·T 설명과 ArgumentException 문구는 MethodBuilder의 Type·제네릭 오버로드와 같게 쓰고,
      요약은 같은 이름의 기존 문자열 오버로드 문구를 따른다. RS0016 메시지 문자열 그대로 PublicAPI.Unshipped.txt 항목(예:
      `Codrio.TypeDeclarationBuilder<TSelf>.BaseType<T>() -> TSelf!`, `Codrio.TypeParameterBuilder.Constraint(System.Type! type) ->
      Codrio.TypeParameterBuilder!`). PublicAPI.Shipped.txt는 건드리지 마라.

      테스트:
      - 새 tests/Codrio.Tests/Builders/DeclarationTypeOverloadTests.cs, `OutputAssert.Equal`로: BaseType 두 오버로드를 class·struct·interface·record·
        record struct 각각에서, 문자열 BaseType과 섞은 순서, 주 생성자·타입 매개변수·제약과 함께 쓴 선언 줄, 본문 없는 record가 `;`로 끝남,
        UnderlyingType 두 오버로드(키워드 별칭, 마지막 호출이 이김), Constraint 두 오버로드를 class·method·delegate의 타입 매개변수에서(문자열
        제약 `class`·`new()`와 섞은 순서), 같은 타입의 문자열·Type·제네릭 출력이 같음, 픽스처 타입(`Outer<int>.Leaf`) 기반 클래스, 잘못된 Type
        (`typeof(List<>)`) → ArgumentException(ParamName `type`)이고 출력 불변, `(Type)null!` → ArgumentNullException(ParamName `type`), 체이닝
        반환값(`Assert.Same`).
      - `CompilationAssert.NoErrors`(입력은 `생성한 파일 + "\n" + TypeFixtures.Source`. 이유: CS1529): 블록 namespace 안에 픽스처
        `Outer<int>.Leaf`를 상속하고 `IDisposable`을 구현하는 class(Dispose 메서드 포함), `BaseType<IDisposable>()` interface, 기반 형식 byte·long
        enum, Type·제네릭 제약을 가진 제네릭 class·메서드·delegate를 담은 완결 파일. 주의: 인터페이스 멤버를 구현해야 한다(CS0535). object 같은
        특수 클래스는 제약이 될 수 없다(CS0702). `class` 제약은 다른 제약보다 앞이어야 한다(CS0449).
      - 기존 테스트 수정: 새 Type 오버로드 때문에 `null!` 인자 호출이 CS0121이 된다. tests/Codrio.Tests/Builders/ClassBuilderTests.cs(현재 125행
        부근 `BaseType(null!)`), EnumBuilderTests.cs(241행 부근 `UnderlyingType(null!)`), TypeParameterBuilderTests.cs(73행 부근
        `Constraint(null!)`)의 그 호출만 인자를 `(string)null!`로 바꾼다. 단언과 다른 테스트는 바꾸지 마라.

      테스트 코드 자체에서 record·init·required를 쓰지 마라(컴파일할 문자열 소스 안은 괜찮다). 이유: 테스트 프로젝트도 net48로 빌드되는데
      IsExternalInit가 없다.
      하지 마라: attribute 오버로드(이유: 스텝 s7·s8), TypeParameter 이름의 Type 오버로드(이유: 타입 매개변수 이름은 타입 참조가 아니라 식별자다),
      `class`·`struct`·`new()`·`unmanaged`·`notnull` 같은 특수 제약 전용 메서드(이유: PRD에 없고 문자열 Constraint로 쓴다), 타입 종류 검증(위 이유).
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러 서버 프로세스가 세션 종료를
      막을 수 있다.
    expected_files:
      - src/Codrio/Builders/TypeDeclarationBuilder.cs
      - src/Codrio/Builders/EnumBuilder.cs
      - src/Codrio/Builders/TypeParameterBuilder.cs
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Builders/DeclarationTypeOverloadTests.cs
      - tests/Codrio.Tests/Builders/ClassBuilderTests.cs
      - tests/Codrio.Tests/Builders/EnumBuilderTests.cs
      - tests/Codrio.Tests/Builders/TypeParameterBuilderTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx

  - id: s7-type-member-attribute-overloads
    title: add System.Type and generic attribute overloads to types and members
    type: feat
    scope: builders
    timeout_sec: 2400
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 2·3의 attribute 설명, 5), docs/ARCHITECTURE.md("레이어 규칙"), docs/ADR.md(ADR-004),
      src/Codrio/Rendering/TypeName.cs, src/Codrio/Rendering/AttributeSyntax.cs, src/Codrio/Builders/TypeBuilder.cs(Attribute, WritePreamble),
      src/Codrio/Builders/MemberBuilder.cs(Attribute), src/Codrio/Builders/MethodBuilder.cs(Type·제네릭 오버로드와 XML 문서 문구),
      src/Codrio/PublicAPI.Unshipped.txt, tests/Codrio.Tests/Builders/TypeAttributeTests.cs, tests/Codrio.Tests/Builders/MemberAttributeTests.cs,
      tests/Codrio.Tests/TestSupport/TypeFixtures.cs.

      타입과 멤버의 attribute 이름에 System.Type·제네릭 오버로드를 붙인다. 공통 기능이므로 제네릭 기반 클래스 TypeBuilder<TSelf>와
      MemberBuilder<TSelf>에 두고 `TSelf`를 반환한다(ARCHITECTURE 레이어 규칙). 그래서 모든 타입 빌더(enum 포함)와 모든 멤버 빌더(델리게이트 포함)에
      적용된다.

      공개 API(TypeBuilder<TSelf>와 MemberBuilder<TSelf> 각각):
      - `public TSelf Attribute(Type type, params string[] arguments)` → `Attribute(TypeName.Render(type, nameof(type)), arguments)`.
      - `public TSelf Attribute<TAttribute>(params string[] arguments) where TAttribute : System.Attribute` → `Attribute(typeof(TAttribute), arguments)`.
        제약을 쓸 때 `System.Attribute`로 완전히 적는다. 이유: 같은 클래스에 `Attribute` 메서드가 있어 읽는 사람이 헷갈린다.
      출력 이름은 변환기 결과 그대로이며 `Attribute` 접미사를 떼지 않는다(`[global::System.ObsoleteAttribute("msg")]`). 이유: 이 저장소는 attribute
      이름을 가공하지 않으며(ADR-004), 접미사가 붙은 완전 한정 이름은 항상 해석된다. `return:` 같은 대상 접두어는 Type 오버로드로 쓸 수 없고
      문자열 오버로드로만 쓴다. 이 점을 XML 문서 remarks에 적는다. Type 오버로드는 Attribute 파생 여부를 검사하지 마라. 이유: 문자열 오버로드도
      검사하지 않고 판단은 컴파일러에 맡긴다(ADR 원칙). 제네릭 오버로드의 제약은 런타임 비용 없이 컴파일 단계에서 막으므로 둔다.
      검사 순서: type 변환(null → ArgumentNullException `type`, 쓸 수 없는 Type → ArgumentException `type`)이 먼저이고, 그다음 기존
      `AttributeSyntax.Render`가 arguments null·null 요소를 검사한다(ParamName `arguments`). 어느 쪽이든 예외면 attribute가 추가되지 않는다.
      기존 문자열 Attribute와 WritePreamble은 고치지 마라. 이유: 기존 출력(문서 줄, attribute 줄, 선언 줄 순서)이 그대로여야 한다.

      출력 예:
      - `CSharp.Class("Widget", c => c.Public().Attribute<SerializableAttribute>().Attribute(typeof(ObsoleteAttribute), "\"Use Gadget.\"", "true"))
        .ToString()` → `[global::System.SerializableAttribute]\n[global::System.ObsoleteAttribute("Use Gadget.", true)]\npublic class Widget\n{\n}\n`
      - `CSharp.Method("Trace", m => m.Attribute<ConditionalAttribute>("\"DEBUG\"")).ToString()` →
        `[global::System.Diagnostics.ConditionalAttribute("DEBUG")]\nvoid Trace();\n`

      문서와 PublicAPI: 새 메서드마다 영어 XML 문서(summary, param 또는 typeparam, returns, exception, remarks). type·TAttribute 설명과
      ArgumentException 문구는 MethodBuilder의 Type·제네릭 오버로드와 같게 쓰고, arguments 설명은 기존 문자열 Attribute 문구를 따른다. RS0016
      메시지 문자열 그대로 PublicAPI.Unshipped.txt 항목(예: `Codrio.TypeBuilder<TSelf>.Attribute(System.Type! type, params string![]! arguments)
      -> TSelf!`, `Codrio.MemberBuilder<TSelf>.Attribute<TAttribute>(params string![]! arguments) -> TSelf!`). PublicAPI.Shipped.txt는 건드리지 마라.

      테스트:
      - 새 tests/Codrio.Tests/Builders/AttributeTypeOverloadTests.cs, `OutputAssert.Equal`로: 두 오버로드의 인자 없음·하나·여러 개, 문자열
        Attribute와 섞은 순서와 중복 유지, Doc과 함께 쓸 때 문서 → attribute → 선언 순서, class·struct·interface·record(본문 없는 `;` 형식)·
        record struct·enum 각각, 8개 멤버(method·field·constructor·property·indexer·event·delegate·operator) 각각의 단독 ToString과 타입 본문 안
        들여쓰기, 같은 attribute 타입의 문자열(`global::System.ObsoleteAttribute`)·Type·제네릭 출력이 같음, 픽스처가 아닌 BCL attribute만 사용,
        잘못된 Type(`typeof(List<>)`) → ArgumentException(ParamName `type`)이고 attribute 미추가, `Attribute((Type)null!)` → ParamName `type`,
        `Attribute(typeof(ObsoleteAttribute), (string[])null!)`와 null 요소 → ParamName `arguments`, 체이닝 반환값(`Assert.Same`, 타입 빌더 5종과
        멤버 빌더 8종).
      - `CompilationAssert.NoErrors`: 블록 namespace 안에 Type·제네릭 attribute만 쓴 `[global::System.SerializableAttribute]` class,
        `[global::System.FlagsAttribute]` enum, `[global::System.Runtime.InteropServices.StructLayoutAttribute(global::System.Runtime.InteropServices.LayoutKind.Sequential)]`
        struct, `[global::System.ObsoleteAttribute]` interface와 record, 그리고 `[global::System.NonSerializedAttribute]` 필드,
        `[global::System.Diagnostics.ConditionalAttribute("DEBUG")]` void 메서드, `[global::System.ComponentModel.BrowsableAttribute(false)]` 속성,
        `[global::System.Runtime.CompilerServices.IndexerNameAttribute("Entry")]` 인덱서, `[global::System.ObsoleteAttribute]` 이벤트·생성자·
        delegate·연산자를 담은 완결 파일. 주의: attribute는 대상 종류에 맞아야 한다(CS0592). Conditional은 void 메서드에만 쓰고(CS0578) 연산자·
        생성자(CS0577), override(CS0243), interface 구현 메서드(CS0629)에는 쓸 수 없다. AllowMultiple이 아닌 attribute 중복은 CS0579다.
      - 기존 테스트 수정: 새 Type 오버로드 때문에 `Attribute(null!)`가 CS0121이 된다. tests/Codrio.Tests/Builders/TypeAttributeTests.cs(현재 146행
        부근)와 MemberAttributeTests.cs(192행 부근)의 그 호출만 `Attribute((string)null!)`로 바꾼다. 단언과 다른 테스트는 바꾸지 마라.

      테스트 코드 자체에서 record·init·required를 쓰지 마라(컴파일할 문자열 소스 안은 괜찮다). 이유: 테스트 프로젝트도 net48로 빌드되는데
      IsExternalInit가 없다.
      하지 마라: ParameterBuilder·EnumMemberBuilder의 attribute 오버로드(이유: 스텝 s8), `Attribute` 접미사 제거나 대상 접두어를 받는 Type 오버로드
      (이유: 위 ADR-004 이유와 작업 범위), AttributeSyntax 변경(이유: 형식 규칙은 이미 한 곳에 있고 그대로 재사용한다), `[assembly: ...]` 진입점
      (이유: PRD 범위 밖, Raw()로 대신한다).
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러 서버 프로세스가 세션 종료를
      막을 수 있다.
    expected_files:
      - src/Codrio/Builders/TypeBuilder.cs
      - src/Codrio/Builders/MemberBuilder.cs
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Builders/AttributeTypeOverloadTests.cs
      - tests/Codrio.Tests/Builders/TypeAttributeTests.cs
      - tests/Codrio.Tests/Builders/MemberAttributeTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx

  - id: s8-parameter-enum-member-attribute-overloads
    title: add System.Type and generic attribute overloads to parameters and enum members
    type: feat
    scope: builders
    timeout_sec: 2400
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 1~7, 공통 완료 기준), docs/ADR.md(ADR-004·006), src/Codrio/Builders/TypeBuilder.cs(스텝 s7의
      Type·제네릭 Attribute 오버로드와 XML 문서 문구), src/Codrio/Builders/ParameterBuilder.cs(Attribute, RenderParameter),
      src/Codrio/Builders/EnumMemberBuilder.cs(Attribute), src/Codrio/Rendering/TypeName.cs, src/Codrio/PublicAPI.Unshipped.txt,
      tests/Codrio.Tests/Builders/AttributeTypeOverloadTests.cs, tests/Codrio.Tests/Builders/AttributeDocCompositionTests.cs(통합 테스트 구성 예),
      tests/Codrio.Tests/TestSupport/TypeFixtures.cs.

      매개변수(주 생성자 매개변수 포함)와 enum 멤버의 attribute 이름에 System.Type·제네릭 오버로드를 붙이고, 이 계획의 모든 오버로드를 섞어 쓴
      통합 테스트로 계획을 마무리한다.

      공개 API(ParameterBuilder와 EnumMemberBuilder 각각, X는 그 빌더 타입): 스텝 s7의 TypeBuilder 오버로드와 같은 의미다.
      - `public X Attribute(Type type, params string[] arguments)` → `Attribute(TypeName.Render(type, nameof(type)), arguments)`.
      - `public X Attribute<TAttribute>(params string[] arguments) where TAttribute : System.Attribute` → `Attribute(typeof(TAttribute), arguments)`.
      출력 이름은 변환기 결과 그대로(`Attribute` 접미사 유지)이고, 대상 접두어(`property:`, `param:`)는 문자열 오버로드로만 쓴다(remarks에 적는다).
      매개변수 attribute는 기존 규칙대로 같은 줄 수식어 앞에, enum 멤버 attribute는 멤버 줄 앞 줄에 나온다. 기존 문자열 Attribute, RenderParameter,
      EnumMemberBuilder.Write·WritePreamble은 고치지 마라. 이유: 기존 출력 규칙이 이미 테스트되어 있다.

      출력 예:
      - `CSharp.Method("Log", m => m.Parameter<string>("caller", p => p.Attribute<CallerMemberNameAttribute>().Default("\"\""))).ToString()` →
        `void Log([global::System.Runtime.CompilerServices.CallerMemberNameAttribute] string caller = "");\n`
      - `CSharp.Enum("Color", e => e.Member("Red", m => m.Attribute(typeof(ObsoleteAttribute), "\"Use Crimson.\"")).Member("Green")).ToString()` →
        `enum Color\n{\n    [global::System.ObsoleteAttribute("Use Crimson.")]\n    Red,\n    Green\n}\n`

      문서와 PublicAPI: 새 메서드마다 영어 XML 문서. 문구는 스텝 s7의 TypeBuilder Type·제네릭 Attribute 오버로드와 같게 쓰고, 위치 설명은 각
      빌더의 기존 문자열 Attribute 문구(같은 줄 수식어 앞 / 멤버 줄 앞)를 따른다. RS0016 메시지 문자열 그대로 PublicAPI.Unshipped.txt 항목(예:
      `Codrio.ParameterBuilder.Attribute<TAttribute>(params string![]! arguments) -> Codrio.ParameterBuilder!`,
      `Codrio.EnumMemberBuilder.Attribute(System.Type! type, params string![]! arguments) -> Codrio.EnumMemberBuilder!`). PublicAPI.Shipped.txt는
      건드리지 마라.

      테스트:
      - tests/Codrio.Tests/Builders/AttributeTypeOverloadTests.cs에 추가, `OutputAssert.Equal`로: ParameterBuilder 두 오버로드의 ToString 조각
        (인자 없음·여러 개, 문자열 Attribute와 섞은 순서, `this`·`ref`·`out`·`params` 수식어와 Default가 있을 때 attribute가 맨 앞), 메서드·
        생성자·delegate·인덱서·연산자 매개변수와 class·record 주 생성자 매개변수 안에서의 출력, EnumMemberBuilder 두 오버로드(첫·중간·마지막 멤버의
        쉼표 위치, Doc과 함께 쓸 때 문서 → attribute → 멤버 줄 순서), 같은 attribute 타입의 문자열·Type·제네릭 출력이 같음, 잘못된 Type → ArgumentException
        (ParamName `type`)이고 attribute 미추가, null 인자(`type`, `arguments` 배열과 null 요소), 체이닝 반환값(`Assert.Same`). ParameterBuilder와
        EnumMemberBuilder는 담는 빌더의 람다로 얻는다.
        `CompilationAssert.NoErrors`: `#nullable enable`과 블록 namespace 안에 `[global::System.Runtime.CompilerServices.CallerMemberNameAttribute]
        string caller = ""` 매개변수 메서드, `[global::System.Diagnostics.CodeAnalysis.NotNullWhenAttribute(true)] out string? value` 매개변수를
        가진 `bool TryGet`(본문에서 대입 후 반환), Type·제네릭 attribute가 있는 생성자·delegate 매개변수, `[global::System.ObsoleteAttribute("...")]`·
        `[global::System.ComponentModel.DescriptionAttribute("read")]` enum 멤버를 담은 완결 파일. 주의: CallerMemberName은 기본값이 있어야 한다
        (CS4021). out 매개변수는 반환 전에 대입해야 한다(CS0177).
      - 새 tests/Codrio.Tests/Builders/TypeOverloadCompositionTests.cs: AutoGeneratedHeader·NullableEnable·Using("System")과 블록 namespace 안에,
        이 계획의 모든 오버로드 종류를 Type과 제네릭으로 섞어 쓴 완결 파일 하나의 기대 문자열 정확 일치와 `CompilationAssert.NoErrors`(입력은
        `생성한 파일 + "\n" + TypeFixtures.Source`. 이유: 생성 파일의 using이 다른 선언보다 앞에 와야 한다, CS1529). 포함할 것: Returns·
        Parameter·Attribute를 Type·제네릭으로 쓴 delegate, UnderlyingType<byte>·Attribute<FlagsAttribute>와 Type attribute가 있는 멤버를 가진
        enum, BaseType<IDisposable>와 Type·제네릭 형식의 메서드·속성·이벤트·인덱서를 가진 interface, 그 interface를 구현하며 Type·제네릭 제약,
        픽스처 기반 클래스(`Outer<int>.Leaf`), Field<T>·Field(Type), 생성자 Parameter<T>, Type attribute가 있는 매개변수, 픽스처 중첩 제네릭·배열·
        Nullable 형식을 쓰는 class, Type·제네릭 반환 형식 연산자(`==`·`!=`)와 implicit·explicit 변환 연산자를 가진 struct, PrimaryParameter<T>를
        가진 record. 요소는 람다와 `CSharp.*` + `Add()` 두 방식을 섞는다. 참조는 모두 같은 파일, 픽스처 소스, BCL로 해석되게 한다(PRD 공통 완료
        기준). 주의: 인터페이스 구현(CS0535), 연산자 `public static`(CS0558)과 `==`·`!=` 짝(CS0216), 변환 연산자의 담는 타입(CS0556), record에
        `==`·`!=`를 선언하지 않음(CS0111). 픽스처를 붙이는 입력에는 파일 범위 namespace를 쓰지 마라(블록 namespace와 섞을 수 없다).
      - 기존 테스트 수정: 새 Type 오버로드 때문에 `Attribute(null!)`가 CS0121이 된다. tests/Codrio.Tests/Builders/ParameterBuilderTests.cs(현재 94행
        부근 `p.Attribute(null!)`)와 EnumMemberBuilderTests.cs(249행 부근 `m.Attribute(null!)`)의 그 호출만 `Attribute((string)null!)`로 바꾼다.
        단언과 다른 테스트는 바꾸지 마라.

      테스트 코드 자체에서 record·init·required를 쓰지 마라(컴파일할 문자열 소스 안은 괜찮다). 이유: 테스트 프로젝트도 net48로 빌드되는데
      IsExternalInit가 없다.
      하지 마라: 이 계획의 다른 오버로드나 TypeName 변경(이유: 스텝 s1~s7에서 끝났다. 통합 테스트에서 실패가 나면 원인을 blockers에 적는다),
      TypeParameterBuilder·AccessorBuilder의 attribute(이유: 작업 범위에 없다), using 자동 수집(이유: ADR-004, PRD 범위 밖), 기존 테스트 기대값
      변경(이유: 기존 문자열 오버로드의 출력은 그대로여야 한다).
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러 서버 프로세스가 세션 종료를
      막을 수 있다.
    expected_files:
      - src/Codrio/Builders/ParameterBuilder.cs
      - src/Codrio/Builders/EnumMemberBuilder.cs
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Builders/AttributeTypeOverloadTests.cs
      - tests/Codrio.Tests/Builders/TypeOverloadCompositionTests.cs
      - tests/Codrio.Tests/Builders/ParameterBuilderTests.cs
      - tests/Codrio.Tests/Builders/EnumMemberBuilderTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx
