id: scaffold-file-builder
goal: >
  빈 저장소에 Codrio의 빌드·테스트·패키징 골격(.NET SDK 10.0.x 고정, netstandard2.0 라이브러리,
  net10.0·net48 xUnit v3 테스트와 Roslyn 컴파일 검증 헬퍼, 패키지 메타데이터, LICENSE, Windows CI)과
  internal 렌더링 기반(CodeWriter, 식별자 검증·키워드 이스케이프 헬퍼)을 만들고, PRD 핵심 기능 1인
  `CSharp` 진입점과 File 빌더(AutoGeneratedHeader, NullableEnable, Using, 블록 Namespace,
  FileScopedNamespace, 네임스페이스 없는 최상위 타입, Raw, 이름과 빈 본문만 렌더링하는 최소 ClassBuilder,
  람다와 `CSharp` 진입점 + Add() 조합)를 구현한다. 완료는 `dotnet build Codrio.slnx -c Release`와
  `dotnet test Codrio.slnx`가 net10.0·net48 모두에서 통과하고, `dotnet pack src/Codrio -c Release`가
  nupkg와 snupkg를 만들며, File 빌더 기능마다 기대 문자열 정확 일치 테스트와 완결 파일의 Roslyn 오류
  진단 0개 테스트가 있는 상태다. 타입 빌더 공통 기능, 다른 타입 종류, 멤버·본문·attribute·Doc 빌더,
  System.Type 오버로드, NuGet 배포, 포맷 옵션은 이 계획에서 하지 않는다.
approved: true
branch_prefix: feat
max_attempts: 3
ac_timeout_sec: 900
steps:
  - id: s1-build-skeleton
    title: add solution, library and test project skeleton
    type: build
    timeout_sec: 2400
    description: |
      먼저 읽을 파일: docs/PRD.md("제약" 절), docs/ARCHITECTURE.md("디렉토리 구조", "레이어 규칙"),
      docs/ADR.md(ADR-001), .gitignore.

      아직 코드가 하나도 없는 저장소에 .NET 솔루션 골격과 테스트용 Roslyn 컴파일 검증 헬퍼를 만든다.
      로컬 SDK는 10.0.403이고 net48 참조 어셈블리는 설치되어 있다.

      1. global.json: `{"sdk": {"version": "10.0.100", "rollForward": "latestFeature", "allowPrerelease": false}}`.
         이유: 10.0.x로 고정하면서 로컬 10.0.403과 CI의 최신 10.0.x를 모두 허용한다.
         `"test"` 섹션(test runner 설정)을 넣지 마라. 이유: Microsoft.Testing.Platform 모드에서는
         AC의 `dotnet test Codrio.slnx` 형태가 동작하지 않는다. `dotnet test`는 VSTest 모드로 돌아야 한다.
      2. Codrio.slnx: src/Codrio/Codrio.csproj와 tests/Codrio.Tests/Codrio.Tests.csproj를 담는다.
      3. Directory.Build.props(저장소 루트): 모든 프로젝트 공통 속성만 둔다. `LangVersion` latest,
         `Nullable` enable, `TreatWarningsAsErrors` true. 버전·PackageId·라이선스·SourceLink·snupkg는
         넣지 마라. 이유: 스텝 s2-packaging-ci가 라이브러리 전용 조건부 그룹으로 추가한다.
      4. src/Codrio/Codrio.csproj: `TargetFramework` netstandard2.0 단일 타깃(`TargetFrameworks` 금지,
         ADR-001), AssemblyName·RootNamespace Codrio, `GenerateDocumentationFile` true,
         `WarningsAsErrors`에 CS1591 추가, `Microsoft.CodeAnalysis.PublicApiAnalyzers` PackageReference
         (`PrivateAssets="all"`), PublicAPI.Shipped.txt·PublicAPI.Unshipped.txt를 `AdditionalFiles`로 추가,
         `<InternalsVisibleTo Include="Codrio.Tests" />`. `PrivateAssets="all"`이 아닌 PackageReference를
         추가하지 마라. 이유: ADR-001 런타임 의존성 0.
         문서 필수와 PublicAPI 분석기 설정은 이 csproj에만 둔다. 이유: 테스트 프로젝트의 public 테스트
         클래스에 XML 문서·PublicAPI 요구가 걸리면 안 된다.
      5. src/Codrio/PublicAPI.Shipped.txt, src/Codrio/PublicAPI.Unshipped.txt: 둘 다 내용은 첫 줄
         `#nullable enable` 하나뿐이다(아직 공개 타입이 없다).
      6. tests/Codrio.Tests/Codrio.Tests.csproj: `TargetFrameworks` net10.0;net48, `OutputType` Exe
         (xUnit v3 요구), `IsPackable` false, PackageReference `xunit.v3`, `xunit.runner.visualstudio`(3.x),
         `Microsoft.NET.Test.Sdk`, `Microsoft.CodeAnalysis.CSharp`, `Basic.Reference.Assemblies.Net80`,
         ProjectReference `../../src/Codrio/Codrio.csproj`. 버전은 nuget.org의 최신 안정판을 정확한 숫자로
         고정한다(와일드카드·프리릴리스 금지). Microsoft.CodeAnalysis.CSharp 버전은
         Basic.Reference.Assemblies.Net80의 Microsoft.CodeAnalysis.Common 의존 범위와 맞춘다.
      7. tests/Codrio.Tests/TestSupport/CompilationAssert.cs (namespace `Codrio.Tests`):
         `internal static class CompilationAssert`
         - `internal static IReadOnlyList<Diagnostic> GetErrors(string source)`: 소스를
           `new CSharpParseOptions(LanguageVersion.Latest)`로 파싱하고 `OutputKind.DynamicallyLinkedLibrary`
           컴파일을 만들어 Severity가 Error인 진단만 돌려준다. 참조는 Basic.Reference.Assemblies.Net80이
           제공하는 전체 참조 집합(예: `Net80.References.All`)만 쓴다.
         - `internal static void NoErrors(string source)`: 오류가 있으면 진단 목록과 원본 소스를 담은
           메시지로 xUnit 단언을 실패시킨다.
         테스트 런타임의 어셈블리(`typeof(object).Assembly.Location`, TRUSTED_PLATFORM_ASSEMBLIES,
         AppDomain 어셈블리 등)를 참조로 쓰지 마라. 이유: net48 런타임 어셈블리에는 record·init에 필요한
         IsExternalInit 등이 없어 뒤 작업의 컴파일 검증이 net48에서만 깨진다.
      8. tests/Codrio.Tests/TestSupport/CompilationAssertTests.cs: (a) 파일 범위 namespace, record, init
         접근자를 쓰는 소스의 GetErrors가 비어 있다(두 TFM 모두에서 통과해야 하며 위 이유를 검증한다),
         (b) `class C { void M() { int x = "s"; } }`의 GetErrors에 CS0029가 있다, (c) NoErrors가 오류 있는
         소스에서 실패한다.
      9. .gitignore: 기존 줄은 그대로 두고 `bin/`, `obj/`, `TestResults/`, `.vs/`, `*.user`를 추가한다.

      테스트 코드 자체에서 record·init·required를 쓰지 마라(컴파일할 문자열 소스 안에서는 괜찮다).
      이유: 테스트 프로젝트도 net48로 빌드되는데 그 대상에는 IsExternalInit가 없다.
      src/Codrio/에 .cs 파일이나 Polyfills/ 디렉토리를 만들지 마라. 이유: 소스는 뒤 스텝에서 추가하고,
      이 계획의 코드는 polyfill이 필요한 기능을 쓰지 않는다. LICENSE와 CI도 만들지 마라(스텝 s2).
      `dotnet new` 템플릿을 쓴다면 Class1.cs, UnitTest1.cs 같은 생성 파일을 남기지 마라. 이유: expected_files 밖이다.
      NuGet 경고(NU1xxx)가 TreatWarningsAsErrors 때문에 오류가 되면 NoWarn으로 끄지 말고 패키지 버전을
      맞춰 해결한다. 해결할 수 없으면 blockers에 적는다.
      AC의 `-f net48` 명령은 테스트 프로젝트가 net48을 타깃하고 그 테스트가 실제로 돈다는 것을 확인한다.
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러
      서버 프로세스가 세션 종료를 막을 수 있다(AGENTS.md의 남은 프로세스 규칙).
    expected_files:
      - global.json
      - Codrio.slnx
      - Directory.Build.props
      - .gitignore
      - src/Codrio/Codrio.csproj
      - src/Codrio/PublicAPI.Shipped.txt
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Codrio.Tests.csproj
      - tests/Codrio.Tests/TestSupport/CompilationAssert.cs
      - tests/Codrio.Tests/TestSupport/CompilationAssertTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx
      - dotnet test tests/Codrio.Tests/Codrio.Tests.csproj -f net48

  - id: s2-packaging-ci
    title: add package metadata, license and CI workflow
    type: build
    description: |
      먼저 읽을 파일: docs/PRD.md("제약", "범위 밖" 절), docs/ADR.md(ADR-001), Directory.Build.props,
      src/Codrio/Codrio.csproj, tests/Codrio.Tests/Codrio.Tests.csproj, global.json.

      라이브러리 패키지 메타데이터, LICENSE, GitHub Actions CI를 추가한다.

      1. Directory.Build.props: 기존 공통 그룹은 그대로 두고, `Condition="'$(MSBuildProjectName)' == 'Codrio'"`인
         PropertyGroup을 추가한다. 내용: `Version` 0.1.0, `PackageId` Codrio, `Authors` LOONACIA,
         `Description`(영어 한 문장: fluent builder로 C# 소스 코드를 생성하는 라이브러리),
         `PackageLicenseExpression` MIT, `PublishRepositoryUrl` true, `EmbedUntrackedSources` true,
         `IncludeSymbols` true, `SymbolPackageFormat` snupkg, `Deterministic` true. 그리고
         `'$(GITHUB_ACTIONS)' == 'true'`일 때만 `ContinuousIntegrationBuild` true.
         이 속성들을 조건 없는 공통 그룹에 두지 마라. 이유: 테스트 프로젝트에 PackageId Codrio가 걸리면 자기와
         같은 ID의 프로젝트를 참조하게 되어 restore가 실패하고, 라이브러리 전용 설정이 테스트에 새면 안 된다.
         SourceLink는 .NET 8 이상 SDK에 내장된 것을 쓴다. 내장 SourceLink가 동작하지 않을 때만
         `Microsoft.SourceLink.GitHub`를 같은 조건의 ItemGroup에 `PrivateAssets="all"`로 추가하고 decisions에 적는다.
         이 로컬 저장소에는 git remote가 없다. remote를 추가하지 마라. 이유: git 상태를 바꾸면 안 된다.
         remote가 없어 SourceLink가 경고만 내는 것은 괜찮다. 그 때문에 AC가 실패하면 RepositoryUrl을 지어내지
         말고 blockers에 적는다.
      2. LICENSE: MIT 표준 문구, 저작권 줄은 `Copyright (c) 2026 LOONACIA`.
      3. .github/workflows/ci.yml: `push`(main 브랜치)와 `pull_request` 트리거, `runs-on: windows-latest`,
         actions/checkout, actions/setup-dotnet(`dotnet-version: 10.0.x`), `dotnet build Codrio.slnx -c Release`,
         `dotnet test Codrio.slnx -c Release --no-build`. pack, publish, NuGet push 단계를 넣지 마라.
         이유: CI는 빌드·테스트만 하고 NuGet 배포는 PRD 범위 밖(수동 배포)이다.

      src/Codrio/Codrio.csproj와 테스트 csproj는 바꾸지 않는다. 바꿔야 한다면 decisions에 이유를 적는다.
      AC의 uv 명령은 Python으로 pack 결과 파일 존재와 ci.yml의 YAML 구문을 확인한다. 그 명령을 고치지 말고
      그대로 통과하게 만든다.
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러
      서버 프로세스가 세션 종료를 막을 수 있다.
    expected_files:
      - Directory.Build.props
      - LICENSE
      - .github/workflows/ci.yml
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx
      - dotnet pack src/Codrio -c Release
      - |-
        uv run --no-project python -c "raise SystemExit(0 if all(__import__('os').path.isfile(f) for f in ('src/Codrio/bin/Release/Codrio.0.1.0.nupkg', 'src/Codrio/bin/Release/Codrio.0.1.0.snupkg')) else 1)"
      - |-
        uv run --no-project --with pyyaml python -c "raise SystemExit(0 if 'jobs' in __import__('yaml').safe_load(open('.github/workflows/ci.yml', encoding='utf-8')) else 1)"

  - id: s3-rendering-foundation
    title: add CodeWriter and identifier validation helper
    type: feat
    scope: rendering
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 5·6), docs/ARCHITECTURE.md("레이어 규칙", "횡단 관심사"),
      docs/ADR.md(ADR-001·002·005), src/Codrio/Codrio.csproj, tests/Codrio.Tests/TestSupport/CompilationAssert.cs.

      모든 빌더가 쓸 internal 렌더링 기반과 테스트용 출력 비교 헬퍼를 만든다. 공개 API는 추가하지 않는다
      (PublicAPI.*.txt를 건드리지 마라).

      1. src/Codrio/Rendering/CodeWriter.cs: `namespace Codrio.Rendering;` `internal sealed class CodeWriter`
         - `internal void WriteLine(string text)`: `\r\n`을 `\n`으로 바꾼 뒤 `\n`으로 나눈 줄마다
           현재 들여쓰기(수준당 공백 4칸) + 줄 + `\n`을 쓴다. 길이 0인 줄은 들여쓰기 없이 `\n`만 쓴다.
           이유: 줄 끝 공백을 만들지 않는다.
         - `internal void WriteBlankLine()`: `\n`만 쓴다.
         - `internal void OpenBlock()`: 현재 들여쓰기로 `{` 줄을 쓰고 들여쓰기를 1 올린다.
         - `internal void CloseBlock()`: 들여쓰기를 1 내리고 `}` 줄을 쓴다.
         - `public override string ToString()`: 지금까지 쓴 전체 문자열.
         탭, `\r\n` 출력, 들여쓰기 크기나 줄바꿈 옵션을 넣지 마라. 이유: ADR-005 고정 포맷.
      2. src/Codrio/Rendering/Identifier.cs: `internal static class Identifier`,
         `internal static string ValidateAndEscape(string name, string paramName)`
         - null이면 `ArgumentNullException(paramName)`.
         - C# 식별자가 아니면 `ArgumentException`(ParamName = paramName). 규칙: 첫 문자는 유니코드 범주
           Lu, Ll, Lt, Lm, Lo, Nl이거나 `_`, 나머지 문자는 그 범주 또는 Nd, Pc, Mn, Mc, Cf. UTF-16 문자 단위로
           `char.GetUnicodeCategory`로 판정한다. 빈 문자열도 예외.
         - 예약 키워드(C# 예약 키워드 77개와 `__arglist`, `__makeref`, `__reftype`, `__refvalue`)면 `"@" + name`.
         - `@`로 시작하고 나머지가 유효한 식별자면 이미 이스케이프된 이름으로 보고 그대로 돌려준다.
         - 문맥 키워드(var, record, value, async 등)는 이스케이프하지 않는다.
         Microsoft.CodeAnalysis를 참조하지 말고 키워드 목록을 코드에 직접 둔다. 이유: ADR-001, src/Codrio는
         Roslyn을 참조하지 않는다.
      3. tests/Codrio.Tests/TestSupport/OutputAssert.cs: `internal static class OutputAssert`,
         `internal static void Equal(string expected, string actual)`. expected의 `\r\n`만 `\n`으로 바꾼 뒤
         actual과 정확히 비교한다. actual은 바꾸지 마라. 이유: 이 저장소는 core.autocrlf=true이고 GitHub
         Windows 러너도 체크아웃할 때 CRLF로 바꾸므로, 테스트 소스의 원시 문자열 리터럴(`"""`) 기대값에
         `\r\n`이 들어간다. 출력 쪽 `\r`은 버그로 잡혀야 한다. 이후 모든 기대 문자열 테스트는 이 헬퍼를 쓴다.
      4. tests/Codrio.Tests/Rendering/CodeWriterTests.cs: 들여쓰기 0에서 한 줄, 중첩 OpenBlock/CloseBlock의
         Allman 출력과 4칸 들여쓰기, 여러 줄 문자열이 줄마다 들여써지는지, `\r\n` 입력이 정규화되는지, 여러 줄
         문자열 안의 빈 줄과 WriteBlankLine이 공백 없는 빈 줄인지, 출력에 `\r`과 탭이 없는지.
      5. tests/Codrio.Tests/Rendering/IdentifierTests.cs: Roslyn `SyntaxFacts.GetReservedKeywordKinds()`의 모든
         키워드(`SyntaxFacts.GetText`)가 `@` + 키워드가 되는지, `SyntaxFacts.GetContextualKeywordKinds()`의
         키워드는 그대로인지, `@`로 시작하지 않는 여러 샘플 이름(`Foo`, `_`, `_1`, `名前`, `1a`, `a-b`, `a b`,
         `a.b`, `""` 등)에서 예외 여부가 `SyntaxFacts.IsValidIdentifier` 결과와 일치하는지, `@class`와 `@foo`가
         그대로 돌아오고 `@`, `@1`은 예외인지, null은 ArgumentNullException이고 예외의 ParamName이 넘긴
         paramName인지.

      빌더, `CSharp` 클래스, Polyfills를 만들지 마라. 이유: 빌더는 스텝 s4부터 추가하고 이 계획의 코드는
      polyfill이 필요 없다.
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러
      서버 프로세스가 세션 종료를 막을 수 있다.
    expected_files:
      - src/Codrio/Rendering/CodeWriter.cs
      - src/Codrio/Rendering/Identifier.cs
      - tests/Codrio.Tests/TestSupport/OutputAssert.cs
      - tests/Codrio.Tests/Rendering/CodeWriterTests.cs
      - tests/Codrio.Tests/Rendering/IdentifierTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx

  - id: s4-file-builder
    title: add CSharp entry point and FileBuilder with headers, usings, top-level classes and Raw
    type: feat
    scope: builders
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 1·5·6·7, "범위 밖"), docs/ARCHITECTURE.md(전체), docs/ADR.md
      (ADR-002·003·005·006), src/Codrio/Rendering/CodeWriter.cs, src/Codrio/Rendering/Identifier.cs,
      tests/Codrio.Tests/TestSupport/CompilationAssert.cs, tests/Codrio.Tests/TestSupport/OutputAssert.cs,
      src/Codrio/PublicAPI.Unshipped.txt.

      첫 공개 API인 `CSharp` 진입점, FileBuilder, 최소 ClassBuilder를 만든다. 네임스페이스는 다음 스텝이다.

      공개 API(모두 `namespace Codrio;`, 파일은 src/Codrio/CSharp.cs와 src/Codrio/Builders/):
      - `public static class CSharp`: `FileBuilder File()`, `FileBuilder File(Action<FileBuilder> configure)`,
        `ClassBuilder Class(string name)`, `ClassBuilder Class(string name, Action<ClassBuilder> configure)`.
      - `public sealed class FileBuilder`: `AutoGeneratedHeader()`, `NullableEnable()`, `Using(string name)`,
        `Class(string name)`, `Class(string name, Action<ClassBuilder> configure)`,
        `Add(ClassBuilder classBuilder)`, `Raw(string code)`. 모두 `FileBuilder`(자기 자신)를 반환한다.
        `public override string ToString()`.
      - `public sealed class ClassBuilder`: `public override string ToString()`만.

      구현 규칙:
      - 공개 타입은 파일 위치와 상관없이 `namespace Codrio;`에 둔다. 이유: 사용자가 `using Codrio;` 하나로 모든
        빌더를 쓴다. 생성자는 internal.
      - 빌더는 상태를 internal 필드로 들고 `internal void Write(CodeWriter writer)`로 자기 조각을 렌더링한다.
        `ToString()`은 새 CodeWriter에 Write한 결과다. 들여쓰기·줄바꿈·중괄호는 CodeWriter 메서드로만 쓴다.
        빌더 코드에 `"\n"`이나 들여쓰기용 공백 문자열을 쓰지 마라(한 줄 안의 토큰 사이 공백은 괜찮다).
      - 항목 목록은 추가 순서를 지키는 단순한 internal 리스트로 둔다(예: `List<Action<CodeWriter>>`에
        `classBuilder.Write`를 넣는다). 렌더링용 공개 인터페이스나 공개 기반 클래스, 빌더와 1:1로 대응하는
        Node/Model 클래스를 만들지 마라. 이유: ADR-002, 공개 API 표면을 늘리지 않는다.
      - 람다를 받는 메서드는 람다 없는 오버로드와 짝으로 둔다. 선택적 매개변수(`= null`)를 쓰지 마라.
        이유: PublicApiAnalyzers RS0026/RS0027 경고(=오류)와 뒤 작업의 오버로드 추가에서 충돌한다. 람다는
        메서드 호출 시점에 새 빌더로 즉시 실행한다.
      - 클래스 이름은 받는 시점에 `Identifier.ValidateAndEscape(name, nameof(name))`로 검증·이스케이프한다
        (잘못된 이름은 그 메서드 호출에서 ArgumentException). `Using` 이름과 `Raw` 코드는 검증 없이 그대로
        출력한다. null 인자(이름, 람다, Add 인자, Raw 코드)는 ArgumentNullException.
      - `Add()`는 받은 인스턴스를 복사하지 않고 그대로 담는다(ADR-006).

      출력 규칙:
      - ClassBuilder: `class <이름>` 줄, `{` 줄, `}` 줄. 접근 제한자·수식어 없음.
      - FileBuilder는 세 구역을 순서대로 쓴다. (1) 헤더: AutoGeneratedHeader()를 호출했으면 `// <auto-generated/>`,
        NullableEnable()을 호출했으면 `#nullable enable`. 호출 순서와 상관없이 이 순서이고 여러 번 호출해도 한 번.
        (2) using: 추가 순서대로 `using <이름>;`. 중복을 제거하지 않는다. (3) 항목: Class/Add/Raw를 추가한 순서.
        Raw는 `CodeWriter.WriteLine`으로 여러 줄을 처리한다.
        비어 있지 않은 구역 사이와 항목 사이에 빈 줄을 정확히 1개 넣는다. 모든 줄은 `\n`으로 끝나고 마지막 줄
        뒤에 빈 줄을 더하지 않는다. 아무것도 없는 FileBuilder는 빈 문자열이다. 예:
        `// <auto-generated/>\n#nullable enable\n\nusing System;\n\nclass Foo\n{\n}\n\n// raw\n`

      문서와 PublicAPI:
      - 모든 공개 타입과 멤버(ToString override 포함)에 영어 XML 문서(summary, param, returns, exception)를 단다.
        이유: NuGet 공개 패키지이고 CS1591이 오류다. FileBuilder·ClassBuilder의 클래스 문서 remarks에 빌더가
        가변이며 스레드 안전하지 않다고 적는다.
      - 새 공개 멤버를 src/Codrio/PublicAPI.Unshipped.txt에 추가한다. RS0016 오류 메시지에 나오는 심볼 문자열을
        그대로 옮기면 된다(예: `static Codrio.CSharp.File() -> Codrio.FileBuilder!`,
        `override Codrio.FileBuilder.ToString() -> string!`). 다 넣은 뒤 한 줄을 잠시 지워 빌드가 RS0016으로
        실패하는지 확인하고 되돌린다. 이유: 분석기가 실제로 동작하는지 확인한다. PublicAPI.Shipped.txt는
        건드리지 마라. 이유: 0.1.0은 아직 배포 전이다.

      테스트(tests/Codrio.Tests/Builders/FileBuilderTests.cs, ClassBuilderTests.cs): 기대 문자열은
      `OutputAssert.Equal`로 정확히 비교한다. 빈 파일, 헤더 각각·둘 다·역순 호출·중복 호출, 여러 using의 순서,
      using과 클래스 사이 빈 줄, 람다 있는/없는 최상위 클래스, `CSharp.Class` + `Add`, `CSharp.File(f => ...)`,
      여러 줄 Raw와 `\r\n` 정규화, 클래스와 Raw가 섞인 항목 순서, `ClassBuilder.ToString()`, 키워드 이름
      (`class` → `@class`), 잘못된 이름이 `Class(...)` 호출 시점에 ArgumentException, null 인자
      ArgumentNullException. 그리고 헤더·using·여러 최상위 클래스·Raw 주석을 모두 쓴 완결 파일과 키워드 이름
      클래스 파일에 `CompilationAssert.NoErrors`.

      하지 마라: Namespace·FileScopedNamespace와 NamespaceBuilder(이유: 스텝 s5, s6), ClassBuilder의 접근 제한자·
      수식어·기반 타입·제네릭·중첩 타입·멤버·Raw와 struct·interface·record·enum(이유: 뒤 작업), System.Type
      오버로드(이유: 마지막 작업), Polyfills(이유: 필요 없음).
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러
      서버 프로세스가 세션 종료를 막을 수 있다.
    expected_files:
      - src/Codrio/CSharp.cs
      - src/Codrio/Builders/FileBuilder.cs
      - src/Codrio/Builders/ClassBuilder.cs
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Builders/FileBuilderTests.cs
      - tests/Codrio.Tests/Builders/ClassBuilderTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx

  - id: s5-block-namespace
    title: add block namespaces to FileBuilder
    type: feat
    scope: builders
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 1·6·7), docs/ARCHITECTURE.md("레이어 규칙", "횡단 관심사"),
      docs/ADR.md(ADR-002·005·006), src/Codrio/CSharp.cs, src/Codrio/Builders/FileBuilder.cs,
      src/Codrio/Builders/ClassBuilder.cs, src/Codrio/Rendering/CodeWriter.cs, src/Codrio/PublicAPI.Unshipped.txt,
      tests/Codrio.Tests/Builders/FileBuilderTests.cs, tests/Codrio.Tests/TestSupport/OutputAssert.cs,
      tests/Codrio.Tests/TestSupport/CompilationAssert.cs.

      블록 namespace를 추가한다. FileBuilder·ClassBuilder가 이미 쓰는 패턴(namespace `Codrio`, internal 생성자,
      internal 상태 필드, `internal void Write(CodeWriter)`, 새 CodeWriter로 렌더링하는 `ToString()`, 추가 순서를
      지키는 internal 항목 리스트, 람다 있는/없는 오버로드 짝, 선택적 매개변수 금지, null 인자
      ArgumentNullException)을 그대로 따른다.

      공개 API:
      - `CSharp`: `NamespaceBuilder Namespace(string name)`,
        `NamespaceBuilder Namespace(string name, Action<NamespaceBuilder> configure)`.
      - `FileBuilder`: `Namespace(string name)`, `Namespace(string name, Action<NamespaceBuilder> configure)`,
        `Add(NamespaceBuilder namespaceBuilder)`. 모두 `FileBuilder` 반환.
      - 새 `public sealed class NamespaceBuilder` (src/Codrio/Builders/NamespaceBuilder.cs): `Class(string name)`,
        `Class(string name, Action<ClassBuilder> configure)`, `Add(ClassBuilder classBuilder)`(모두
        `NamespaceBuilder` 반환), `public override string ToString()`.

      출력 규칙:
      - namespace 이름은 using처럼 검증 없이 그대로 출력한다(`A.B` 허용). 클래스 이름은 기존처럼
        `Identifier.ValidateAndEscape`로 받는 시점에 검증한다.
      - NamespaceBuilder: `namespace <이름>` 줄, `{`, 한 단계 들여쓴 항목들(추가 순서, 항목 사이 빈 줄 정확히 1개),
        `}`. 빈 namespace는 `namespace A\n{\n}\n`. 예:
        `namespace A.B\n{\n    class C\n    {\n    }\n\n    class D\n    {\n    }\n}\n`
      - FileBuilder에서 namespace는 클래스·Raw와 같은 항목 목록에 들어가 추가 순서를 지키고, 항목 사이 빈 줄
        1개 규칙과 헤더·using 구역 규칙을 그대로 따른다.

      문서와 PublicAPI: 새 공개 멤버마다 영어 XML 문서, NamespaceBuilder 클래스 remarks에 가변이며 스레드 안전하지
      않다는 내용, PublicAPI.Unshipped.txt 항목(RS0016 메시지의 문자열 그대로). PublicAPI.Shipped.txt는 건드리지 마라.

      테스트(tests/Codrio.Tests/Builders/NamespaceBuilderTests.cs, FileBuilderTests.cs에 추가): `OutputAssert.Equal`로
      빈 namespace, 클래스 둘이 든 namespace의 들여쓰기와 빈 줄, `CSharp.Namespace` + `FileBuilder.Add`,
      `NamespaceBuilder.Add(CSharp.Class(...))`, `NamespaceBuilder.ToString()`, 점이 든 이름, namespace 안 키워드
      클래스 이름(`@class`), 최상위 클래스와 namespace가 섞인 파일의 순서, 헤더·using·namespace가 모두 있는 파일,
      null 인자 예외. 그리고 헤더·using·namespace 두 개(각각 클래스 포함)·최상위 클래스를 쓴 완결 파일에
      `CompilationAssert.NoErrors`.

      하지 마라: FileScopedNamespace(이유: 스텝 s6), NamespaceBuilder의 Raw·중첩 namespace(이유: 작업 범위에 없다),
      ClassBuilder 확장과 다른 타입 종류(이유: 뒤 작업). s4의 기존 테스트 기대값을 바꾸지 마라. 이유: 기존 출력
      규칙은 그대로여야 한다.
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러
      서버 프로세스가 세션 종료를 막을 수 있다.
    expected_files:
      - src/Codrio/CSharp.cs
      - src/Codrio/Builders/FileBuilder.cs
      - src/Codrio/Builders/NamespaceBuilder.cs
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Builders/FileBuilderTests.cs
      - tests/Codrio.Tests/Builders/NamespaceBuilderTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx

  - id: s6-file-scoped-namespace
    title: add file-scoped namespaces
    type: feat
    scope: builders
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 1·7, "범위 밖"), docs/ADR.md(ADR-005·006),
      docs/ARCHITECTURE.md("횡단 관심사"), src/Codrio/CSharp.cs, src/Codrio/Builders/FileBuilder.cs,
      src/Codrio/Builders/NamespaceBuilder.cs, src/Codrio/PublicAPI.Unshipped.txt,
      tests/Codrio.Tests/Builders/NamespaceBuilderTests.cs, tests/Codrio.Tests/Builders/FileBuilderTests.cs.

      파일 범위 namespace(`namespace A;`)를 추가한다. 기존 빌더 패턴(람다 있는/없는 오버로드 짝, 선택적 매개변수
      금지, null 인자 ArgumentNullException, internal 상태와 `Write(CodeWriter)`, CodeWriter로만 줄바꿈·들여쓰기)을
      따른다.

      공개 API:
      - `CSharp`: `NamespaceBuilder FileScopedNamespace(string name)`,
        `NamespaceBuilder FileScopedNamespace(string name, Action<NamespaceBuilder> configure)`.
      - `FileBuilder`: `FileScopedNamespace(string name)`,
        `FileScopedNamespace(string name, Action<NamespaceBuilder> configure)`. 모두 `FileBuilder` 반환.
      별도의 FileScopedNamespaceBuilder 타입을 만들지 마라. NamespaceBuilder에 파일 범위인지 나타내는 internal
      상태를 두고 internal 생성자에서 정한다. 이유: 내용(클래스, Add)은 블록 namespace와 같고 렌더링만 다르다.
      `FileBuilder.Add(NamespaceBuilder)`와 `NamespaceBuilder.ToString()`은 그 상태대로 렌더링한다. 기본
      `Namespace(...)`의 블록 출력은 바꾸지 마라. 이유: ADR-005 기본 출력은 하위 호환 블록 namespace다.

      출력 규칙:
      - 파일 범위 NamespaceBuilder: `namespace <이름>;` 줄. 항목이 있으면 빈 줄 하나 뒤에 들여쓰기 없이 항목들
        (추가 순서, 사이 빈 줄 정확히 1개). 예: `namespace A;\n\nclass B\n{\n}\n`. 항목이 없으면 `namespace A;\n`.
      - FileBuilder에서는 다른 항목처럼 추가 순서대로 나오고 항목 사이 빈 줄 1개 규칙을 따른다. 그래서
        `CSharp.File().FileScopedNamespace("A").Class("B")`도 `namespace A;\n\nclass B\n{\n}\n`이 된다.
      - 파일 범위 namespace를 여러 개 넣거나, 블록 namespace와 섞거나, 타입 뒤에 넣는 것은 검사하지 않고 추가
        순서대로 출력한다. 렌더링 단계에서 예외를 던지지 마라. 이유: ARCHITECTURE 횡단 관심사, 판단하기 애매한
        검증은 컴파일러에게 맡긴다(ADR 원칙). 이 제약(파일당 하나, 타입 선언보다 앞)은 XML 문서에 적는다.

      문서와 PublicAPI: 새 공개 멤버마다 영어 XML 문서와 PublicAPI.Unshipped.txt 항목. PublicAPI.Shipped.txt는
      건드리지 마라.

      테스트(NamespaceBuilderTests.cs, FileBuilderTests.cs에 추가): `OutputAssert.Equal`로 내용 없는 파일 범위
      namespace, 람다로 클래스 둘을 넣은 경우, `FileScopedNamespace("A")` 뒤 파일 수준 `Class("B")`,
      `CSharp.FileScopedNamespace` + `FileBuilder.Add`, 파일 범위 `NamespaceBuilder.ToString()`, 헤더·using·
      파일 범위 namespace·클래스·Raw 주석이 모두 있는 파일, null 인자 예외. 그리고 마지막 두 형태(람다 형태와
      `FileScopedNamespace("A").Class("B")` 형태)의 완결 파일에 `CompilationAssert.NoErrors`.

      하지 마라: LangVersion 검사나 옵션(이유: ADR-005), 블록 namespace 출력 변경, s4·s5 테스트 기대값 변경,
      ClassBuilder 확장과 다른 타입 종류(이유: 뒤 작업).
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러
      서버 프로세스가 세션 종료를 막을 수 있다.
    expected_files:
      - src/Codrio/CSharp.cs
      - src/Codrio/Builders/FileBuilder.cs
      - src/Codrio/Builders/NamespaceBuilder.cs
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Builders/FileBuilderTests.cs
      - tests/Codrio.Tests/Builders/NamespaceBuilderTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx
