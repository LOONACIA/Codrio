    type: feat
    scope: builders
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 2·7), docs/ADR.md(ADR-003·006), src/Codrio/Builders/TypeDeclarationBuilder.cs,
      src/Codrio/Builders/StructBuilder.cs, src/Codrio/CSharp.cs, src/Codrio/Builders/FileBuilder.cs,
      src/Codrio/Builders/NamespaceBuilder.cs, src/Codrio/PublicAPI.Unshipped.txt, tests/Codrio.Tests/Builders/StructBuilderTests.cs.

      interface 선언 빌더를 추가한다. 스텝 s3에서 StructBuilder를 추가한 방식(새 빌더 파일, `CSharp`·FileBuilder·
      NamespaceBuilder·TypeDeclarationBuilder의 람다 있는/없는 메서드와 Add 오버로드, XML 문서, PublicAPI 항목, 테스트 구성)을
      그대로 따른다.

      공개 API:
      - 새 src/Codrio/Builders/InterfaceBuilder.cs: `public sealed class InterfaceBuilder : TypeDeclarationBuilder<InterfaceBuilder>`,
        internal 생성자 `InterfaceBuilder(string name)`가 키워드 `interface`를 넘긴다.
      - `CSharp`: `InterfaceBuilder Interface(string name)`, `InterfaceBuilder Interface(string name, Action<InterfaceBuilder> configure)`.
      - `FileBuilder`, `NamespaceBuilder`, `TypeDeclarationBuilder<TSelf>`: `Interface(string name)`,
        `Interface(string name, Action<InterfaceBuilder> configure)`, `Add(InterfaceBuilder interfaceBuilder)`. 각자 자기
        자신(TypeDeclarationBuilder는 `TSelf`)을 반환한다.
      InterfaceBuilder에서 물려받은 수식어 메서드(Static, Sealed 등)를 숨기거나 막지 마라. 이유: 수식어는 공통 기능이고
      조합 유효성은 검사하지 않는다(PRD "범위 밖", 컴파일러가 잡는다).

      출력: 예: `CSharp.Interface("IRepository", i => i.BaseType("System.IDisposable").TypeParameter("T", t => t.Constraint("class"))
      .Partial().Public())` → `public partial interface IRepository<T> : System.IDisposable where T : class\n{\n}\n`.
      본문은 class와 같다(빈 interface도 `{`/`}` 블록).

      문서와 PublicAPI: 새 공개 타입·멤버에 영어 XML 문서, InterfaceBuilder 클래스 remarks(가변, 스레드 안전하지 않음),
