      테스트(새 tests/Codrio.Tests/Builders/InterfaceBuilderTests.cs): `OutputAssert.Equal`로 빈 interface, `CSharp.Interface`
      람다 있는/없는 경우(즉시 한 번 실행, 같은 인스턴스), 접근 제한자와 partial, 제네릭·제약·기반 인터페이스 여러 개,
      `FileBuilder.Interface`/`Add`, `NamespaceBuilder.Interface`/`Add`, class·struct 안 중첩 interface와 interface 안 중첩
      class·struct·interface, Raw와 섞인 항목 순서, 키워드 이름(`interface` → `@interface`), 잘못된 이름이 호출 시점에
      ArgumentException(ParamName `name`)이고 람다 미실행, null 인자(`name`, `configure`, `interfaceBuilder`), 체이닝 반환값.
      Add의 null 검사는 `Add((InterfaceBuilder)null!)`처럼 캐스트한다.
      `CompilationAssert.NoErrors`: 헤더·using·namespace 안에 `public partial interface IRepository<T> : System.IDisposable
      where T : class`, 인터페이스 상속(같은 파일의 다른 interface를 BaseType으로), class 안 중첩 interface, interface 안 중첩
      class를 쓴 완결 파일. 기존 테스트 기대값은 바꾸지 마라.

      테스트 코드 자체에서 record·init·required를 쓰지 마라. 이유: 테스트 프로젝트도 net48로 빌드되는데 IsExternalInit가 없다.
      하지 마라: 타입 매개변수 variance(`in`/`out`) API(이유: 작업 범위에 없다), record·enum(이유: 스텝 s6·s7),
