  - id: s5-primary-parameters
    title: add ParameterBuilder and primary constructor parameters for classes and structs
    type: feat
    scope: builders
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 2, 핵심 기능 3의 메서드 매개변수 설명, 5), docs/ARCHITECTURE.md("레이어 규칙"의
      조각 빌더 예외), docs/ADR.md(ADR-003·004), src/Codrio/Builders/TypeDeclarationBuilder.cs,
      src/Codrio/Builders/TypeParameterBuilder.cs, src/Codrio/Builders/ClassBuilder.cs, src/Codrio/Builders/StructBuilder.cs,
      src/Codrio/Builders/InterfaceBuilder.cs, src/Codrio/PublicAPI.Unshipped.txt,
      tests/Codrio.Tests/Builders/TypeParameterBuilderTests.cs.

      뒤 작업의 메서드 매개변수에서도 재사용할 ParameterBuilder와, class·struct(다음 스텝의 record 포함)의 주 생성자
      매개변수 `PrimaryParameter()`를 추가한다. 기존 패턴(람다 있는/없는 오버로드 짝, 선택적 매개변수 금지, 람다 즉시 실행,
      null 인자 ArgumentNullException, 이름은 받는 시점에 `Identifier.ValidateAndEscape(name, nameof(name))`)을 따른다.

      공개 API:
      - 새 src/Codrio/Builders/ParameterBuilder.cs: `public sealed class ParameterBuilder`, internal 생성자
        `ParameterBuilder(string type, string name)`(type null이면 ArgumentNullException `type`, name은 식별자 헬퍼로 검증·
        이스케이프). `ParameterBuilder Ref()`, `Out()`, `In()`, `Params()`, `This()`: 각 수식어의 internal bool을 켠다(중복
        호출해도 한 번 출력). `ParameterBuilder Default(string expression)`: 기본값 식, 마지막 호출이 이김, null이면
        ArgumentNullException(`expression`). `public override string ToString()`.
      - 새 src/Codrio/Builders/ClassOrStructBuilder.cs: `public abstract class ClassOrStructBuilder<TSelf> :
        TypeDeclarationBuilder<TSelf> where TSelf : ClassOrStructBuilder<TSelf>`, internal 생성자.
        `TSelf PrimaryParameter(string type, string name)`, `TSelf PrimaryParameter(string type, string name,
        Action<ParameterBuilder> configure)`: 추가 순서대로 주 생성자 매개변수 목록에 넣는다.
      - ClassBuilder와 StructBuilder의 기반 클래스를 `ClassOrStructBuilder<ClassBuilder>`, `ClassOrStructBuilder<StructBuilder>`로
        바꾼다. InterfaceBuilder는 `TypeDeclarationBuilder<InterfaceBuilder>`를 그대로 상속한다. 이유: C# interface에는 주
        생성자가 없다(ADR-003: 허용하지 않는 것은 메서드가 없어야 한다).

      출력 규칙:
      - ParameterBuilder 조각(줄바꿈 없음): `[this ][ref ][out ][in ][params ]<형식> <이름>[ = <기본값 식>]`. 수식어는 호출
        순서와 무관하게 이 고정 순서이고 조합 유효성은 검사하지 않는다(`this ref`, `this in` 같은 유효한 조합을 쓸 수 있게
        bool 여러 개로 둔다). 형식과 기본값 식은 그대로 출력한다(ADR-004). docs/ARCHITECTURE.md의 조각 빌더 예외대로
        CodeWriter 없이 조각 문자열을 만드는 internal 메서드를 두고 ToString()이 그 결과를 돌려준다.
      - 선언 줄에서 주 생성자 매개변수 목록은 타입 매개변수 목록 바로 뒤, 기반 타입 목록 앞이다:
        `class Box<T>(T value, int count = 0) : Base where T : class`. 매개변수는 `, `로 구분하고, PrimaryParameter를 호출하지
        않으면 괄호를 쓰지 않는다. class·struct 본문은 매개변수가 있어도 지금처럼 `{`/`}` 블록이다.
      - 선언 줄 조립은 TypeDeclarationBuilder 한 곳에 두고, 매개변수 목록은 ClassOrStructBuilder가 override하는 internal
        virtual 훅(예: 기본값이 빈 문자열인 `internal virtual string ParameterList()`)으로 끼운다. 이유: 선언 줄의 문법 순서를
        한 곳에서 지키고 InterfaceBuilder에는 공개 메서드가 생기지 않게 한다.

      문서와 PublicAPI: 새 공개 타입·멤버에 영어 XML 문서, ClassOrStructBuilder에 `<typeparam name="TSelf">`(CS1712), 새 공개
      타입 remarks(가변, 스레드 안전하지 않음), RS0016 메시지 문자열 그대로 PublicAPI.Unshipped.txt 항목. PublicAPI.Shipped.txt는
      건드리지 마라.

      테스트(새 tests/Codrio.Tests/Builders/ParameterBuilderTests.cs): `OutputAssert.Equal`로 람다로 얻은 ParameterBuilder의
      ToString — 기본 형태, 수식어 각각, 역순으로 호출한 여러 수식어의 고정 순서, 중복 호출, Default와 마지막 호출이 이김,
      키워드 이름(`class` → `@class`), 형식 문자열 그대로 출력; class·struct의 PrimaryParameter 람다 있는/없는 경우와 순서,
      타입 매개변수·기반 타입·where 절과 함께 쓴 선언 줄, PrimaryParameter가 없을 때 기존 출력 유지; 잘못된 이름이 호출
      시점에 ArgumentException(ParamName `name`)이고 람다 미실행; null 인자(`type`, `name`, `configure`, `expression`);
      체이닝 반환값(`Assert.Same`); 리플렉션으로 `typeof(InterfaceBuilder)`의 공개 메서드에 `PrimaryParameter`가 없음.
      `CompilationAssert.NoErrors`: `public class Service(string name, int retries = 3)`, `public readonly struct Point(int x, int y)`,
      `params int[] values` 매개변수, 같은 파일에 선언한 기반 클래스를 쓰는 제네릭 `class Box<T>(T value) : Base where T : class`를
      담은 완결 파일. 기존 테스트 기대값은 바꾸지 마라.

      테스트 코드 자체에서 record·init·required를 쓰지 마라. 이유: 테스트 프로젝트도 net48로 빌드되는데 IsExternalInit가 없다.
      하지 마라: `CSharp`의 Parameter 진입점이나 `Add(ParameterBuilder)`(이유: 작업 범위는 람다로 만드는 매개변수이고, 타입
      본문 항목의 Add 오버로드와 의미가 섞인다), `scoped`·`ref readonly` 같은 다른 매개변수 수식어(이유: 작업 범위에 없다),
      RecordBuilder(이유: 스텝 s6), 메서드·생성자 멤버(이유: 뒤 작업).
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러 서버 프로세스가
      세션 종료를 막을 수 있다.
    expected_files:
      - src/Codrio/Builders/ParameterBuilder.cs
      - src/Codrio/Builders/ClassOrStructBuilder.cs
      - src/Codrio/Builders/TypeDeclarationBuilder.cs
      - src/Codrio/Builders/ClassBuilder.cs
      - src/Codrio/Builders/StructBuilder.cs
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Builders/ParameterBuilderTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx

  - id: s6-record-builder
    title: add RecordBuilder for record classes and record structs
    type: feat
    scope: builders
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 2·7), docs/ADR.md(ADR-003·005·006), src/Codrio/Builders/TypeDeclarationBuilder.cs,
      src/Codrio/Builders/ClassOrStructBuilder.cs, src/Codrio/Builders/StructBuilder.cs, src/Codrio/Builders/NamespaceBuilder.cs
      (internal bool로 출력 형태를 고르는 예), src/Codrio/CSharp.cs, src/Codrio/Builders/FileBuilder.cs,
      src/Codrio/PublicAPI.Unshipped.txt, tests/Codrio.Tests/Builders/StructBuilderTests.cs.

      record class와 record struct를 만드는 RecordBuilder를 추가한다. 스텝 s3·s4에서 StructBuilder·InterfaceBuilder를 추가한
      방식(새 빌더 파일, `CSharp`·FileBuilder·NamespaceBuilder·TypeDeclarationBuilder의 람다 있는/없는 메서드와 Add 오버로드,
      XML 문서, PublicAPI 항목, 테스트 구성)을 따른다.

      공개 API:
      - 새 src/Codrio/Builders/RecordBuilder.cs: `public sealed class RecordBuilder : ClassOrStructBuilder<RecordBuilder>`,
        internal 생성자 `RecordBuilder(string name, bool isStruct)`가 키워드 `record` 또는 `record struct`를 넘긴다.
        별도의 RecordStructBuilder나 공개 kind 속성을 만들지 마라. 이유: 작업이 둘을 한 RecordBuilder로 정했고 둘은 키워드만
        다르다(NamespaceBuilder의 internal fileScoped와 같은 방식).
      - `CSharp`: `RecordBuilder Record(string name)`, `RecordBuilder Record(string name, Action<RecordBuilder> configure)`,
        `RecordBuilder RecordStruct(string name)`, `RecordBuilder RecordStruct(string name, Action<RecordBuilder> configure)`.
      - `FileBuilder`, `NamespaceBuilder`, `TypeDeclarationBuilder<TSelf>`: 같은 네 메서드(각자 자기 자신 또는 `TSelf` 반환)와
        `Add(RecordBuilder recordBuilder)`.

      출력 규칙:
      - 키워드: Record → `record`(`record class`라고 쓰지 않는다. 이유: C# 9부터 되는 가장 짧은 형태), RecordStruct →
        `record struct`. partial은 `record` 바로 앞이다: `public readonly partial record struct Point(int X, int Y);`.
      - 본문 항목(중첩 타입, Raw)이 하나도 없으면 블록 대신 선언 줄 끝에 `;`를 바로 붙인다: `public sealed record Person(string Name);\n`,
        `record Empty;\n`, `record Box<T>(T Value) where T : class;\n`. 항목이 있으면 class처럼 `{`/`}` 블록이다. 이 규칙은
        RecordBuilder에만 적용한다. TypeDeclarationBuilder에 internal virtual 훅(예: `internal virtual bool EndsWithSemicolonWhenEmpty => false`)을
        두고 RecordBuilder만 true로 override한다. class·struct·interface는 항목이 없어도 지금처럼 빈 블록이다.

      문서와 PublicAPI: 새 공개 타입·멤버에 영어 XML 문서, RecordBuilder 클래스 remarks(가변, 스레드 안전하지 않음, 본문 항목이
      없으면 `;`로 끝남), RS0016 메시지 문자열 그대로 PublicAPI.Unshipped.txt 항목. PublicAPI.Shipped.txt는 건드리지 마라.

      테스트(새 tests/Codrio.Tests/Builders/RecordBuilderTests.cs): `OutputAssert.Equal`로 빈 record와 빈 record struct(`;`),
      `CSharp.Record`/`RecordStruct` 람다 있는/없는 경우(즉시 한 번 실행, 같은 인스턴스), 주 생성자 매개변수, 수식어 순서
      (`public sealed partial record`, `public readonly partial record struct`), 제네릭·where 절 뒤의 `;`, 기반 record,
      본문 항목이 있으면 블록이 되는 경우(중첩 class, Raw), Add 뒤 항목을 추가하면 `;`에서 블록으로 바뀜, `FileBuilder`·
      `NamespaceBuilder`·class 안 중첩 위치의 Record/RecordStruct/Add, 키워드 이름(`class` → `@class`), 잘못된 이름이 호출 시점에 ArgumentException(ParamName `name`)이고 람다 미실행, null 인자(`name`,
      `configure`, `recordBuilder`), 체이닝 반환값. Add의 null 검사는 `Add((RecordBuilder)null!)`처럼 캐스트한다.
      `CompilationAssert.NoErrors`: namespace 안에 `public abstract partial record Shape;`, `public sealed record Circle(double Radius) : Shape;`,
      `public readonly record struct Point(int X, int Y);`, `public record Box<T>(T Value) where T : class;`, 본문(중첩 class)이 있는
      record, class 안 중첩 record를 담은 완결 파일. 기존 테스트 기대값은 바꾸지 마라.

      테스트 코드 자체에서 record·init·required를 쓰지 마라(컴파일할 문자열 소스 안은 괜찮다). 이유: 테스트 프로젝트도
      net48로 빌드되는데 IsExternalInit가 없다. src/Codrio에서도 record를 쓰거나 Polyfills를 만들지 마라.
      하지 마라: class·struct에도 `;` 끝맺음 적용(이유: 작업은 record에만 요구한다), enum(이유: 스텝 s7), 속성·메서드 같은
      멤버(이유: 뒤 작업).
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러 서버 프로세스가
      세션 종료를 막을 수 있다.
    expected_files:
      - src/Codrio/Builders/RecordBuilder.cs
      - src/Codrio/Builders/TypeDeclarationBuilder.cs
      - src/Codrio/CSharp.cs
      - src/Codrio/Builders/FileBuilder.cs
      - src/Codrio/Builders/NamespaceBuilder.cs
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Builders/RecordBuilderTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx

  - id: s7-enum-builder
    title: add EnumBuilder with underlying type and members
    type: feat
    scope: builders
    description: |
      먼저 읽을 파일: docs/PRD.md(핵심 기능 2·5·6·7, 공통 완료 기준), docs/ADR.md(ADR-003·004·006),
      src/Codrio/Builders/TypeBuilder.cs, src/Codrio/Builders/TypeDeclarationBuilder.cs, src/Codrio/Builders/RecordBuilder.cs,
      src/Codrio/CSharp.cs, src/Codrio/Builders/FileBuilder.cs, src/Codrio/Builders/NamespaceBuilder.cs,
      src/Codrio/PublicAPI.Unshipped.txt, tests/Codrio.Tests/Builders/RecordBuilderTests.cs.

      enum 선언 빌더를 추가하고, 이 계획의 모든 타입 종류를 한 파일에 조합하는 통합 테스트로 마무리한다. 진입점·Add·문서·
      PublicAPI·테스트 구성은 스텝 s3·s4·s6과 같은 방식이다.

      공개 API:
      - 새 src/Codrio/Builders/EnumBuilder.cs: `public sealed class EnumBuilder : TypeBuilder<EnumBuilder>`, internal 생성자
        `EnumBuilder(string name)`. `EnumBuilder UnderlyingType(string type)`: 기반 형식, 마지막 호출이 이김, null이면
        ArgumentNullException(`type`). `EnumBuilder Member(string name)`, `EnumBuilder Member(string name, string value)`: 이름은
        `Identifier.ValidateAndEscape(name, nameof(name))`로 검증·이스케이프하고 값 식은 그대로 출력한다(null이면
        ArgumentNullException `value`, ADR-004). `internal override void Write(CodeWriter writer)`.
      - `CSharp`: `EnumBuilder Enum(string name)`, `EnumBuilder Enum(string name, Action<EnumBuilder> configure)`.
      - `FileBuilder`, `NamespaceBuilder`, `TypeDeclarationBuilder<TSelf>`: `Enum(string name)`,
        `Enum(string name, Action<EnumBuilder> configure)`, `Add(EnumBuilder enumBuilder)`.
      EnumBuilder는 TypeDeclarationBuilder를 상속하지 않으므로 수식어, BaseType, TypeParameter, 중첩 타입, Raw, PrimaryParameter
      메서드가 없다. 이유: ADR-003, C#은 enum에 접근 제한자 외 수식어·제네릭·중첩 타입·주 생성자를 허용하지 않는다.
      EnumBuilder에 Raw를 따로 추가하지도 마라. 이유: enum 본문은 쉼표로 구분한 멤버 목록이라 원시 줄이 쉼표 규칙에 낄 수 없다.

      출력 규칙: `[접근 제한자 ]enum <이름>[ : <기반 형식>]`, `{`, 한 단계 들여쓴 멤버 줄(`<이름>` 또는 `<이름> = <값>`, 추가
      순서), 마지막 멤버를 뺀 모든 멤버 줄 끝에 `,`, 멤버 사이 빈 줄 없음, `}`. 멤버 없는 enum은 `enum E\n{\n}\n`. 예:
      `CSharp.Enum("Color", e => e.Public().UnderlyingType("byte").Member("Red").Member("Green", "2").Member("Blue"))` →
      `public enum Color : byte\n{\n    Red,\n    Green = 2,\n    Blue\n}\n`. 렌더링 중 예외를 던지지 마라(ARCHITECTURE 횡단 관심사).

      문서와 PublicAPI: 새 공개 타입·멤버에 영어 XML 문서, EnumBuilder 클래스 remarks(가변, 스레드 안전하지 않음), RS0016 메시지
      문자열 그대로 PublicAPI.Unshipped.txt 항목. PublicAPI.Shipped.txt는 건드리지 마라.

      테스트:
      - 새 tests/Codrio.Tests/Builders/EnumBuilderTests.cs: `OutputAssert.Equal`로 빈 enum, 멤버 1개(쉼표 없음)·여러 개, 값 있는/
        없는 멤버, 값 식 그대로(`1 << 2`, `Red | Green`), UnderlyingType과 마지막 호출이 이김, 접근 제한자, `CSharp.Enum` 람다
        있는/없는 경우(즉시 한 번 실행, 같은 인스턴스), `FileBuilder`·`NamespaceBuilder`·class·struct·interface·record 안 중첩
        위치의 Enum/Add, 키워드 enum 이름과 멤버 이름(`class` → `@class`), 잘못된 이름(enum, 멤버)이 호출 시점에
        ArgumentException(ParamName `name`), null 인자(`name`, `configure`, `type`, `value`, `enumBuilder`), 체이닝 반환값, 리플렉션으로
        `typeof(EnumBuilder)`의 공개 메서드 이름에 `Static`, `Abstract`, `Sealed`, `ReadOnly`, `Partial`, `BaseType`,
        `TypeParameter`, `PrimaryParameter`, `Class`, `Struct`, `Interface`, `Record`, `RecordStruct`, `Enum`, `Raw`, `Add`가
        없음. Add의 null 검사는 `Add((EnumBuilder)null!)`처럼 캐스트한다. `CompilationAssert.NoErrors`: 기반 형식·값 식·키워드
        멤버를 쓴 enum과 class·struct·interface·record 안 중첩 enum이 든 완결 파일.
      - 새 tests/Codrio.Tests/Builders/TypeBuilderCompositionTests.cs: 헤더·using·블록 namespace에 class·struct·interface·
        record·record struct·enum을 람다와 `CSharp.*` + `Add()` 두 방식으로 섞고, 접근 제한자·수식어·제네릭과 제약·기반 타입·
        주 생성자·2단계 중첩·Raw 주석을 모두 쓴 완결 파일 하나의 기대 문자열 정확 일치와 `CompilationAssert.NoErrors`. 그리고
        같은 내용을 파일 범위 namespace로 만든 파일의 `CompilationAssert.NoErrors`. 참조는 모두 같은 파일이나 BCL로 해석되게
        한다(PRD 공통 완료 기준).
      기존 테스트 기대값은 바꾸지 마라.

      테스트 코드 자체에서 record·init·required를 쓰지 마라. 이유: 테스트 프로젝트도 net48로 빌드되는데 IsExternalInit가 없다.
      하지 마라: `[Flags]` 같은 attribute와 enum 멤버별 빌더(이유: attribute·Doc은 뒤 작업), 멤버 값 자동 부여나 이름 중복 검사
      (이유: 판단하기 애매한 검증은 컴파일러에게 맡긴다), System.Type 오버로드(이유: 마지막 작업).
      끝내기 전에 `dotnet build-server shutdown`을 실행한다. 이유: dotnet 명령이 남긴 MSBuild 노드·컴파일러 서버 프로세스가
      세션 종료를 막을 수 있다.
    expected_files:
      - src/Codrio/Builders/EnumBuilder.cs
      - src/Codrio/Builders/TypeDeclarationBuilder.cs
      - src/Codrio/CSharp.cs
      - src/Codrio/Builders/FileBuilder.cs
      - src/Codrio/Builders/NamespaceBuilder.cs
      - src/Codrio/PublicAPI.Unshipped.txt
      - tests/Codrio.Tests/Builders/EnumBuilderTests.cs
      - tests/Codrio.Tests/Builders/TypeBuilderCompositionTests.cs
    ac:
      - dotnet build Codrio.slnx -c Release
      - dotnet test Codrio.slnx
